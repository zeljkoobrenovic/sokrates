# Builds the Sokrates CLI image and publishes it to the GitHub Container Registry as
# ghcr.io/zeljkoobrenovic/sokrates, so users can run Sokrates without installing Java or Maven:
#
#   docker run --rm -v "$(pwd):/code" ghcr.io/zeljkoobrenovic/sokrates analyze
#
# Tags: every push to master → :latest (+ :master and :sha-<short sha>); a version tag vX.Y.Z →
# :X.Y.Z and :X.Y. Uses the repository's own GITHUB_TOKEN, no extra secret is needed
# (the package is private until it is made public once in the GitHub package settings).
name: Publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 runtime stage)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
