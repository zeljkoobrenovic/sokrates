<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    ${sokrates-theme}
    <title>Files Explorer</title>
    <style>
        body {
            font-family: var(--sk-font);
        }

        .group {
            display: inline-block;
            border: 1px solid var(--sk-border);
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: var(--sk-surface-2);
        }

        a {
            text-decoration: none;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

        body {
            margin: 40px;
        }

        ::placeholder {
            color: var(--sk-text-faint);
            opacity: 1;
        }

        :-ms-input-placeholder {
            color: var(--sk-text-faint);
        }

        ::-ms-input-placeholder {
            color: var(--sk-text-faint);
        }

        td {
            white-space: nowrap;
            overflow: hidden;
        }

        /* Long file and folder names are cut with an ellipsis (full name on hover), so the columns on the right stay visible. */
        .sk-file-line {
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sortable {
            cursor: pointer;
            user-select: none;
        }

        .sortable:hover {
            color: var(--sk-text);
        }

        .sort-active {
            color: var(--sk-text);
            font-weight: bold;
        }

        .sort-arrow {
            font-size: 80%;
        }

        /* Loading indicator shown while the embedded data is inflated + the first render runs. */
        #loading {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--sk-text-muted);
            font-size: 15px;
            padding: 40px 4px;
        }

        #loading .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--sk-border);
            border-top-color: var(--sk-accent);
            border-radius: 50%;
            animation: sokrates-spin 0.8s linear infinite;
        }

        @keyframes sokrates-spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* Column picker ("Columns" button next to the search box). */
        .sk-columns {display: inline-block; position: relative; margin-left: 12px; vertical-align: top;}
        .sk-columns > summary {list-style: none; cursor: pointer; padding: 5px 12px; font-size: 14px; color: var(--sk-text);
            background: var(--sk-surface); border: 1px solid var(--sk-border-strong); border-radius: 6px; white-space: nowrap;}
        .sk-columns > summary::-webkit-details-marker {display: none;}
        .sk-columns > summary::after {content: ' \25BE'; color: var(--sk-text-muted);}
        .sk-columns-panel {position: absolute; z-index: 20; top: 36px; left: 0; min-width: 230px; padding: 10px 14px;
            background: var(--sk-surface); border: 1px solid var(--sk-border); border-radius: 8px; box-shadow: var(--sk-shadow-hover);}
        .sk-columns-group {margin: 6px 0 2px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--sk-text-faint);}
        .sk-columns-panel label {display: block; padding: 2px 0; font-size: 14px; color: var(--sk-text); white-space: nowrap; cursor: pointer;}
        .sk-columns-reset {display: inline-block; margin-top: 8px; font-size: 13px; color: var(--sk-accent); cursor: pointer;}
    </style>
    ${sokrates-inflate-lib}
</head>
<body style="margin: 12px">

<div id="loading">
    <div class="spinner"></div>
    <span>Loading files data…</span>
</div>

<div id="report" style="display: none;">
    <div style="margin: 0; color: var(--sk-text-muted)">
        <div>
            <div style="padding: 0px; margin-bottom: 26px; white-space: nowrap">
                Scope: &nbsp;
                <label><input type="checkbox" id="main" checked onchange="update()"><span
                        id="label_main">main</span></label>&nbsp;&nbsp;
                <label><input type="checkbox" id="test" checked onchange="update()"><span
                        id="label_test">test</span></label>&nbsp;&nbsp;
                <label><input type="checkbox" id="generated" checked onchange="update()"><span id="label_generated">generated</span></label>&nbsp;&nbsp;
                <label><input type="checkbox" id="build" checked onchange="update()"><span
                        id="label_build">build</span></label>&nbsp;&nbsp;
                <label><input type="checkbox" id="other" checked onchange="update()"><span
                        id="label_other">other</span></label>&nbsp;&nbsp;&nbsp;&nbsp;
                <span id="scope-summary" style="background-color: var(--sk-surface-2)"></span>
            </div>
            <input id="filter" type="text" placeholder="search... (use ; for multiple terms)"
                   style="font-size: 16px; height: 32px; width: 420px; margin-bottom: 10px"
                   onkeyup="update()">
            <div id="search-summary" style="display: inline-block"></div>
            <details id="columns" class="sk-columns">
                <summary>Columns</summary>
                <div id="columns-panel" class="sk-columns-panel"></div>
            </details>
        </div>
    </div>

    <div id="content"></div>
</div>

<script>
    let importedFiles = ${data};

    // Map of language/extension -> base64 image data URI, injected at report-generation time.
    const langIcons = ${langIcons};

    // File-size risk thresholds {low, medium, high, veryHigh} (in lines of code), injected at
    // report-generation time, used to colour-code the LOC bar. Falls back to sensible defaults if
    // the placeholder was not substituted.
    let fileSizeThresholds = ${fileSizeThresholds};
    if (!fileSizeThresholds || typeof fileSizeThresholds.veryHigh !== 'number') {
        fileSizeThresholds = {low: 100, medium: 200, high: 500, veryHigh: 1000};
    }

    // Green (negligible) -> red (very high), matching the risk palette family.
    const RISK_COLORS = ['var(--sk-risk-negligible, #1a9641)', 'var(--sk-risk-low, #a6d96a)', '#fdae61', '#f03b20', '#bd0026'];

    // Returns a risk color for a value against {low, medium, high, veryHigh} thresholds.
    function riskColor(value, t) {
        if (!t) return RISK_COLORS[0];
        if (value > t.veryHigh) return RISK_COLORS[4];
        if (value > t.high) return RISK_COLORS[3];
        if (value > t.medium) return RISK_COLORS[2];
        if (value > t.low) return RISK_COLORS[1];
        return RISK_COLORS[0];
    }

    // File age / freshness / change-frequency / contributors thresholds, injected at generation time
    // (with defaults), used to colour the corresponding columns like the File Age and File Change
    // Frequency reports do.
    function withDefaults(t, def) {
        return (t && typeof t.veryHigh === 'number') ? t : def;
    }
    const fileAgeThresholds = withDefaults(${fileAgeThresholds}, {low: 30, medium: 90, high: 180, veryHigh: 365});
    const fileFreqThresholds = withDefaults(${fileUpdateFrequencyThresholds}, {low: 5, medium: 20, high: 50, veryHigh: 100});
    const fileContribThresholds = withDefaults(${fileContributorsCountThresholds}, {low: 1, medium: 5, high: 10, veryHigh: 25});

    // Report palettes (index 0 = very-high band ... index 4 = negligible band), mirroring
    // Palette.getAgePalette / getFreshnessPalette / getHeatPalette on the Java side.
    const AGE_PALETTE = ['#4a3c31', '#fac831', '#ffdf44', '#fff18e', '#fcf4cb'];
    const FRESHNESS_PALETTE = ['#041E02', '#006d2c', '#31a354', '#74c476', '#bae4b3'];
    const HEAT_PALETTE = ['#b21227', '#f7844e', '#e6f5df', '#b0d8e9', '#6192c3'];

    // Maps a value to its risk band against {low, medium, high, veryHigh} (same boundaries as
    // RiskDistributionStats.update) and returns the matching palette colour. Palettes are ordered
    // very-high -> negligible, so band 0 = very-high.
    function bandColor(value, t, palette) {
        if (value < 0 || !t) return '';
        if (value <= t.low) return palette[4];        // negligible
        if (value <= t.medium) return palette[3];     // low
        if (value <= t.high) return palette[2];       // medium
        if (value <= t.veryHigh) return palette[1];   // high
        return palette[0];                            // very high
    }

    // Some palette tones are very light; pick a readable text colour for the badge.
    function textOn(bg) {
        return (bg === '#fcf4cb' || bg === '#fff18e' || bg === '#ffdf44' || bg === '#e6f5df'
            || bg === '#bae4b3' || bg === '#b0d8e9') ? '#333' : 'white';
    }

    // A table cell with a value rendered as a colour-coded badge; shows a muted dash when absent.
    function colorCell(value, present, bg) {
        let inner;
        if (!present) {
            inner = '<span style="color: var(--sk-text-faint)">-</span>';
        } else {
            inner = '<span style="display: inline-block; min-width: 26px; padding: 1px 5px; border-radius: 4px; background-color: '
                + bg + '; color: ' + textOn(bg) + '">' + value.toLocaleString('en-US') + '</span>';
        }
        return '<td style="text-align: center; padding-right: 5px; padding-left: 5px; font-size: 80%;">' + inner + '</td>';
    }

    // Everything interpolated into innerHTML below is repository-controlled (paths, extensions,
    // repository names, dates from git): escape it for element content and attribute values.
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Renders a small round language badge: an icon when one is known, otherwise a text bubble
    // with the language name (mirrors DataImageUtils.getLangDataImageDiv on the Java side).
    function langIcon(lang) {
        if (!lang) {
            return '';
        }
        const key = lang.toLowerCase();
        const size = 30;
        if (langIcons[key]) {
            return '<img title="' + esc(lang) + '" style="margin-right: 5px; vertical-align: middle; background-color: #f1f1f1; '
                + 'border-radius: 50%; border: 1px solid var(--sk-border); width: ' + size + 'px; height: ' + size + 'px; object-fit: contain;" src="'
                + langIcons[key] + '">';
        }
        const fontSize = lang.length <= 3 ? 9 : 8;
        return '<div title="' + esc(lang) + '" style="margin-right: 5px; display: inline-block; vertical-align: middle; '
            + 'background-color: #D6E4E1; border-radius: 50%; border: 1px solid var(--sk-border-strong); overflow: hidden; color: darkblue; '
            + 'width: ' + size + 'px; height: ' + size + 'px; line-height: ' + size + 'px; '
            + 'font-size: ' + fontSize + 'px; font-weight: bold; text-align: center;">' + esc(lang) + '</div>';
    }

    importedFiles.forEach(file => {
        let key = file.scope.replace('.txt', '').replace('aspect_', '').trim().toLowerCase();
        if (key == 'build_and_deployment') {
            key = 'build';
        }
        if (!document.getElementById(key)) {
            key = 'other';
        }
        file.scope = key;
    });


    const importedFileMap = {};

    let files = [];

    importedFiles.forEach(file => {
        const key = file.repository + '/' + file.path;
        if (!importedFileMap[key]) {
            importedFileMap[key] = true;
            files.push(file);
        }
    });

    function getScopes(files) {
        const scopeMap = {};
        const scopes = [];
        files.forEach(file => {
            const key = file.scope;
            if (!scopeMap[key]) {
                scopeMap[key] = {scope: key, filesCount: 0};
                scopes.push(scopeMap[key]);
            }

            scopeMap[key].filesCount += 1;
        });

        scopes.sort((a, b) => b.filesCount - a.filesCount);
        return scopes;
    }


    // True when a file carries git-history data; only main files do, so history-only columns
    // (commits / contributors / age / freshness) have no value for test/build/generated/other files.
    function hasHistoryData(item) {
        return (item.commitsCount || 0) > 0 || (item.latestCommitDate || '').length > 0;
    }

    // Sortable column definitions: each maps a key to a value accessor.
    // 'dir' is the default direction applied the first time a column is selected.
    // 'historyOnly' marks columns whose data exists only for main files; files without history are
    // always sorted to the bottom for these columns (regardless of direction).
    const sortColumns = {
        lang: {value: item => (item.mainLang || '').toLowerCase(), type: 'string', dir: 1},
        repo: {value: item => (item.repository || '').toLowerCase(), type: 'string', dir: 1},
        name: {value: item => (item.repository + '/' + item.path).toLowerCase(), type: 'string', dir: 1},
        loc: {value: item => item.linesOfCode, type: 'number', dir: -1},
        recentCommits: {value: item => item.recentCommitsCount30Days || 0, type: 'number', dir: -1, historyOnly: true},
        recentCommits90: {value: item => item.recentCommitsCount90Days || 0, type: 'number', dir: -1, historyOnly: true},
        commits: {value: item => item.commitsCount || 0, type: 'number', dir: -1, historyOnly: true},
        churn30: {value: item => item.churn30Days || 0, type: 'number', dir: -1, historyOnly: true},
        churn90: {value: item => item.churn90Days || 0, type: 'number', dir: -1, historyOnly: true},
        churnTotal: {value: item => item.churnTotal || 0, type: 'number', dir: -1, historyOnly: true},
        contributors: {value: item => item.contributorsCount || 0, type: 'number', dir: -1, historyOnly: true},
        contributors30: {value: item => item.contributorsCount30Days || 0, type: 'number', dir: -1, historyOnly: true},
        contributors90: {value: item => item.contributorsCount90Days || 0, type: 'number', dir: -1, historyOnly: true},
        units: {value: item => item.unitsCount || 0, type: 'number', dir: -1},
        mcCabe: {value: item => item.mcCabeIndexSum || 0, type: 'number', dir: -1},
        age: {value: item => (item.ageDays == null ? -1 : item.ageDays), type: 'number', dir: -1, historyOnly: true},
        freshness: {value: item => (item.freshnessDays == null ? -1 : item.freshnessDays), type: 'number', dir: 1, historyOnly: true},
        latestCommit: {value: item => item.latestCommitDate || '', type: 'string', dir: -1, historyOnly: true},
        scope: {value: item => item.scope || '', type: 'string', dir: 1}
    };

    let sortKey = 'loc';
    let sortDir = -1;

    // The optional columns, in table order, with their header group and default visibility. The
    // defaults keep the table readable (all-time commits and churn, contributors, latest commit, scope);
    // the recent windows, age and freshness are one click away in the "Columns" menu, and the choice is
    // remembered in the browser.
    const OPTIONAL_COLUMNS = [
        {key: 'units', group: null, menuGroup: 'code', label: '#<br>units', menu: 'units (functions, methods)', field: 'unitsCount', positive: true, show: true},
        {key: 'mcCabe', group: null, menuGroup: 'code', label: 'McCabe<br>index', menu: 'McCabe index (sum over units)', field: 'mcCabeIndexSum', positive: true, show: true},
        {key: 'recentCommits', group: 'commits', label: '30d', menu: '30 days', history: true, show: false},
        {key: 'recentCommits90', group: 'commits', label: '90d', menu: '90 days', history: true, show: false},
        {key: 'commits', group: 'commits', label: 'all', menu: 'all', history: true, show: true},
        {key: 'churn30', group: 'line churn', label: '30d', menu: '30 days', history: true, show: false},
        {key: 'churn90', group: 'line churn', label: '90d', menu: '90 days', history: true, show: false},
        {key: 'churnTotal', group: 'line churn', label: 'all', menu: 'all', history: true, show: false},
        {key: 'contributors30', group: 'contributors', label: '30d', menu: '30 days', history: true, field: 'contributorsCount30Days', show: false},
        {key: 'contributors90', group: 'contributors', label: '90d', menu: '90 days', history: true, field: 'contributorsCount90Days', show: false},
        {key: 'contributors', group: 'contributors', label: 'all', menu: 'all', history: true, show: true},
        {key: 'age', group: null, label: 'age<br>(days)', menu: 'age (days since first commit)', history: true, show: false},
        {key: 'freshness', group: null, label: 'freshness<br>(days)', menu: 'freshness (days since last commit)', history: true, show: false},
        {key: 'latestCommit', group: null, label: 'latest<br>commit', menu: 'latest commit', history: true, show: false},
        {key: 'scope', group: null, label: 'scope', menu: 'scope', history: false, show: true}
    ];
    const COLUMNS_KEY = 'sokrates-files-explorer-columns';
    const visibleColumns = {};
    OPTIONAL_COLUMNS.forEach(c => visibleColumns[c.key] = c.show);
    try {
        const saved = JSON.parse(localStorage.getItem(COLUMNS_KEY) || '{}');
        Object.keys(saved).forEach(k => { if (k in visibleColumns) { visibleColumns[k] = !!saved[k]; } });
    } catch (e) {
    }

    function isVisible(key) {
        return !!visibleColumns[key];
    }

    function setColumnVisible(key, visible) {
        visibleColumns[key] = visible;
        try { localStorage.setItem(COLUMNS_KEY, JSON.stringify(visibleColumns)); } catch (e) {}
        // A hidden column cannot show the sort order: fall back to size.
        if (!visible && sortKey === key) {
            sortKey = 'loc';
            sortDir = -1;
        }
        update();
    }

    function resetColumns() {
        OPTIONAL_COLUMNS.forEach(c => visibleColumns[c.key] = c.show);
        try { localStorage.removeItem(COLUMNS_KEY); } catch (e) {}
        if (!isVisible(sortKey) && sortColumns[sortKey] && OPTIONAL_COLUMNS.some(c => c.key === sortKey)) {
            sortKey = 'loc';
            sortDir = -1;
        }
        renderColumnsPanel(anyHistory);
        update();
    }

    // Whether the data has a column at all: history columns need history, and a column backed by an
    // optional field needs that field (left out by the landscape) — with a positive value when the
    // field is 0 for files without it (units, McCabe).
    function isAvailable(c, hasHistory) {
        if (c.history && !hasHistory) {
            return false;
        }
        if (c.field) {
            return files.some(f => f[c.field] != null && (!c.positive || f[c.field] > 0));
        }
        return true;
    }

    // The "Columns" menu: grouped checkboxes of the columns the data has.
    function renderColumnsPanel(hasHistory) {
        const panel = document.getElementById('columns-panel');
        panel.textContent = '';
        let lastGroup;
        OPTIONAL_COLUMNS.filter(c => isAvailable(c, hasHistory)).forEach(c => {
            const group = c.group || c.menuGroup || (c.history ? 'file history' : 'other');
            if (group !== lastGroup) {
                const title = document.createElement('div');
                title.className = 'sk-columns-group';
                title.textContent = group;
                panel.appendChild(title);
                lastGroup = group;
            }
            const label = document.createElement('label');
            const box = document.createElement('input');
            box.type = 'checkbox';
            box.checked = isVisible(c.key);
            box.addEventListener('change', () => setColumnVisible(c.key, box.checked));
            label.appendChild(box);
            label.appendChild(document.createTextNode(' ' + c.menu));
            panel.appendChild(label);
        });
        const reset = document.createElement('a');
        reset.className = 'sk-columns-reset';
        reset.textContent = 'Reset to default';
        reset.addEventListener('click', resetColumns);
        panel.appendChild(reset);
    }

    // Close the menu on a click elsewhere.
    document.addEventListener('click', e => {
        const menu = document.getElementById('columns');
        if (menu && menu.open && !menu.contains(e.target)) { menu.open = false; }
    });

    function comparator(a, b) {
        const column = sortColumns[sortKey];
        // For history-only columns, files without history always sink to the bottom — their values
        // (0 / -1 / "") would otherwise interleave meaninglessly with main files.
        if (column.historyOnly) {
            const aHas = hasHistoryData(a);
            const bHas = hasHistoryData(b);
            if (aHas !== bHas) {
                return aHas ? -1 : 1;
            }
        }
        const va = column.value(a);
        const vb = column.value(b);
        let cmp;
        if (column.type === 'string') {
            cmp = String(va).localeCompare(String(vb));
        } else {
            cmp = va < vb ? -1 : (va > vb ? 1 : 0);
        }
        return cmp * sortDir;
    }

    function sortHeader(key, label, extraStyle, rowspan) {
        const active = sortKey === key;
        const arrow = active ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
        const cls = 'sortable' + (active ? ' sort-active' : '');
        const span = rowspan ? ' rowspan="' + rowspan + '"' : '';
        return '<td class="' + cls + '"' + span + ' style="vertical-align: bottom; ' + (extraStyle || '') + '" onclick="update(\'' + key + '\')">'
            + label + '<span class="sort-arrow">' + arrow + '</span></td>';
    }

    // A non-sortable header cell spanning several sub-columns (the first row of the two-row header).
    function groupHeader(label, colspan) {
        return '<td colspan="' + colspan + '" style="text-align: center; border-bottom: 1px solid var(--sk-border);">' + label + '</td>';
    }

    // Base path (from the explorers/ folder) to the per-repository HTML reports / cached source
    // files, so each file card can link to them. Empty (e.g. in the landscape, where these do not
    // exist at a single location) suppresses the links.
    let reportLinkBase = '${reportLinkBase}';
    if (reportLinkBase.indexOf('${') === 0) {
        reportLinkBase = '';
    }
    // Whether source was cached (into ../src/<aspect>.zip, viewed via ../src/viewer.html).
    // Suppresses the file-name link when off.
    let saveSourceFiles = '${saveSourceFiles}' === 'true';

    files = files.sort(comparator);
    const anyHistory = files.some(item => hasHistoryData(item));

    function getReposCount(files) {
        const allReposMap = {};
        let reposCount = 0;

        files.forEach(file => {
            if (file.repository && !allReposMap[file.repository]) {
                allReposMap[file.repository] = true;
                reposCount++;
            }
        });

        return reposCount;
    }

    function getLoc(files) {
        return files.map(item => item.linesOfCode).reduce((a, b) => a + b, 0);
    }

    function update(clickedKey) {
        if (clickedKey && sortColumns[clickedKey]) {
            if (sortKey === clickedKey) {
                sortDir = -sortDir;
            } else {
                sortKey = clickedKey;
                sortDir = sortColumns[clickedKey].dir;
            }
        }
        files = files.sort(comparator);
        // A search can contain several terms separated by ";"; the result is the UNION of the
        // individual term matches (search "a;b" returns matches of "a" plus matches of "b").
        const filters = document.getElementById('filter').value.toLowerCase().trim()
            .split(';').map(s => s.trim()).filter(s => s.length);
        let html = '';

        const scopedData = files
            .filter(item => document.getElementById(item.scope).checked);

        let scopedCount = scopedData.length;
        let scopedLoc = scopedData.map(item => item.linesOfCode).reduce((a, b) => a + b, 0);
        const scopedReposCount = getReposCount(scopedData)

        const scopedRepoInfo = scopedReposCount ? ', ' + scopedReposCount + ' repositories' : '';
        let totalReposCount = getReposCount(files);
        const totalRepoInfo = totalReposCount ? ', ' + totalReposCount + ' repositories' : '';
        document.getElementById('scope-summary').innerHTML = '[' + scopedCount.toLocaleString('en-US') + ' ' + (scopedCount === 1 ? 'file' : 'files') + '; ' + scopedLoc.toLocaleString('en-US') + ' LOC' + scopedRepoInfo + '] of ' + '[' + files.length.toLocaleString('en-US') + ' ' + (files.length === 1 ? 'file' : 'files') + '; ' + getLoc(files).toLocaleString('en-US') + ' LOC' + totalRepoInfo + ']';

        const filteredData = scopedData
            .filter(item => {
                if (!item.path) {
                    return false;
                }
                if (!filters.length) {
                    return true;
                }
                const haystack = (item.repository + ' ' + item.path).toLowerCase();
                return filters.some(f => haystack.includes(f));
            });

        let maxLoc = 1;
        filteredData.forEach(item => maxLoc = Math.max(maxLoc, item.linesOfCode));

        let filteredCount = filteredData.length;
        let filteredLoc = filteredData.map(item => item.linesOfCode).reduce((a, b) => a + b, 0);
        const filteredReposCount = getReposCount(filteredData)

        const repoInfo = filteredReposCount ? ', ' + filteredReposCount + ' repositories' : '';

        document.getElementById('search-summary').innerHTML = ' = ' + filteredCount.toLocaleString('en-US') + ' ' + (filteredCount === 1 ? 'file' : 'files') + ' (' + filteredLoc.toLocaleString('en-US') + ' LOC' + repoInfo + ')';

        if (scopedLoc > filteredLoc) {
            html += '<div style="width: 400px; margin: 0; padding: 0; white-space: nowrap">';
            const w1count = Math.round(100 * filteredCount / scopedCount);
            const w2count = 100 - w1count;
            html += '<div style="margin: 0; display: inline-block; width: ' + w1count + '%; background-color: var(--sk-text); height: 12px"></div>';
            html += '<div style="margin: 0; display: inline-block; width: ' + w2count + '%; background-color: var(--sk-border-strong); height: 12px"></div>';
            html += '<div style="margin: 0; display: inline-block; font-size: 80%; width: 100px; color: var(--sk-text-muted); vertical-align: top">&nbsp;' + (filteredLoc == 0 || w1count > 0 ? w1count : '<1') + '% of scoped files</div>';
            html += '</div>';
            if (filteredReposCount) {
                html += '<div style="width: 400px; margin: 0; padding: 0; white-space: nowrap">';
                const w1repo = Math.round(100 * filteredReposCount / scopedReposCount);
                const w2repo = 100 - w1repo;
                html += '<div style="margin: 0; display: inline-block; width: ' + w1repo + '%; background-color: var(--sk-text); height: 12px"></div>';
                html += '<div style="margin: 0; display: inline-block; width: ' + w2repo + '%; background-color: var(--sk-border-strong); height: 12px"></div>';
                html += '<div style="margin: 0; display: inline-block; font-size: 80%; width: 100px; color: var(--sk-text-muted); vertical-align: top">&nbsp;' + (filteredLoc == 0 || w1repo > 0 ? w1repo : '<1') + '% of scoped repositories</div>';
                html += '</div>';
            }
            html += '<div style="width: 400px; margin: 0; padding: 0; white-space: nowrap">';
            const w1loc = Math.round(100 * filteredLoc / scopedLoc);
            const w2loc = 100 - w1loc;
            html += '<div style="margin: 0; display: inline-block; width: ' + w1loc + '%; background-color: skyblue; height: 12px"></div>';
            html += '<div style="margin: 0; display: inline-block; width: ' + w2loc + '%; background-color: var(--sk-border-strong); height: 12px"></div>';
            html += '<div style="margin: 0; display: inline-block; font-size: 80%; width: 100px; color: var(--sk-text-muted); vertical-align: top">&nbsp;' + (filteredLoc == 0 || w1loc > 0 ? w1loc : '<1') + '% of scoped LOC</div>';
            html += '</div>';
            html += '<div style="width: 400px; margin: 0; padding: 0; white-space: nowrap">';

        }

        // Only show the git-history columns when at least one file in the (scoped) data has history.
        const hasHistory = scopedData.some(item => (item.commitsCount || 0) > 0 || (item.latestCommitDate || '').length);

        html += '<table style="width: 100%">';

        // Optional columns shown for this data (history columns only when there is history).
        const shown = OPTIONAL_COLUMNS.filter(c => isVisible(c.key) && isAvailable(c, hasHistory));
        const grouped = shown.filter(c => c.group);
        // Two header rows only when a grouped column (commits / line churn windows) is shown: row 1 has
        // the group titles over their visible sub-columns, every other column spans both rows.
        const rs = grouped.length ? 2 : undefined;
        html += '<tr style="color: var(--sk-text-muted); background-color: var(--sk-surface-2)">';
        html += sortHeader('lang', 'lang', 'text-align: center', rs);
        if (filteredReposCount) {
            html += sortHeader('repo', 'repo', 'text-align: left', rs);
        }
        html += sortHeader('name', 'file', 'text-align: left', rs);
        html += sortHeader('loc', '&nbsp;LOC', 'text-align: left', rs);
        let lastGroup = null;
        shown.forEach(c => {
            if (c.group) {
                if (c.group !== lastGroup) {
                    html += groupHeader(c.group, shown.filter(x => x.group === c.group).length);
                }
            } else {
                html += sortHeader(c.key, c.label, 'text-align: center', rs);
            }
            lastGroup = c.group;
        });
        html += '</tr>';
        if (grouped.length) {
            html += '<tr style="color: var(--sk-text-muted); background-color: var(--sk-surface-2)">';
            grouped.forEach(c => html += sortHeader(c.key, c.label, 'text-align: center'));
            html += '</tr>';
        }

        let displayCounter = 0;

        filteredData.forEach(item => {
            if (displayCounter > 1000) {
                return;
            }
            displayCounter++;
            html += '<tr>';
            html += '<td style="text-align: center; vertical-align: middle;">';
            html += langIcon(item.mainLang);
            html += '</td>';
            if (filteredReposCount) {
                html += '<td>';
                const pathsRepo = item.repository.split('/');
                const repoName = pathsRepo[pathsRepo.length - 1];
                const repoPrefix = pathsRepo.slice(0, pathsRepo.length - 1).join(' / ');
                html += '<div style="border-left: 1px solid var(--sk-border); padding-left: 6px">';
                html += '<div style="font-size: 90%; color: var(--sk-text-muted)">' + esc(repoPrefix) + '</div>';
                html += '<div style="margin-bottom: 6px; color: var(--sk-text); font-weight: bold">' + esc(repoName) + '</div>';
                html += '</div>';
                html += '</td>';
            }
            html += '<td>';
            const paths = item.path.split('/');
            const fileName = paths[paths.length - 1];
            let folder = paths.slice(0, paths.length - 1).join('/');
            html += '<div style="border-left: 1px solid var(--sk-border); padding-left: 6px">';
            html += '<div class="sk-file-line" title="' + esc(folder) + '" style="font-size: 90%; color: var(--sk-text-muted)">' + esc(folder) + '</div>';
            // File name: link to the cached source page when available, otherwise plain bold text.
            // (sourceFileLink is percent-encoded by the generator; escaping it is defense in depth.)
            if (saveSourceFiles && item.sourceFileLink) {
                html += '<div class="sk-file-line" title="' + esc(fileName) + '" style="margin-bottom: 2px"><a href="' + esc(item.sourceFileLink) + '" target="_blank" '
                    + 'style="color: var(--sk-accent); font-weight: bold">' + esc(fileName) + ' <span style="font-size: 60%; color: var(--sk-text-muted)">&#x2197;</span></a></div>';
            } else {
                html += '<div class="sk-file-line" title="' + esc(fileName) + '" style="margin-bottom: 2px; color: var(--sk-text); font-weight: bold">' + esc(fileName) + '</div>';
            }
            html += '</div>';
            html += '</td>';

            let scope = item.scope;
            html += '<td style="text-align: left; padding-right: 5px; padding-left: 5px">';
            html += '<div style=" border-radius: 4px; padding 2px;">';
            const w = maxLoc > 0 ? Math.round(50 * item.linesOfCode / maxLoc + 1) : 0;
            // Bar colour reflects the file-size risk band; non-main files are muted (lower opacity)
            // so the scope distinction is preserved.
            const barColor = riskColor(item.linesOfCode, fileSizeThresholds);
            const barOpacity = scope === 'main' ? '1' : '0.45';
            html += '<div style="vertical-align: top; display: inline-block; height: 16px; background-color: ' + barColor + '; opacity: ' + barOpacity + '; width: ' + w + 'px"></div>';
            html += '<div style="margin-left: 2px; vertical-align: top; display: inline-block; font-size: 80%">' + item.linesOfCode.toLocaleString("en-US") + '</div>';
            html += '</div>';
            html += '</td>';
            const recent = item.recentCommitsCount30Days || 0;
            const recent90 = item.recentCommitsCount90Days || 0;
            const total = item.commitsCount || 0;
            const churn30 = item.churn30Days || 0;
            const churn90 = item.churn90Days || 0;
            const churnTotal = item.churnTotal || 0;
            const contributors = item.contributorsCount || 0;
            const ageDays = (item.ageDays == null) ? -1 : item.ageDays;
            const freshnessDays = (item.freshnessDays == null) ? -1 : item.freshnessDays;
            const dash = '<span style="color: var(--sk-text-faint)">-</span>';
            const plain = (n) => '<td style="text-align: center; padding-right: 5px; padding-left: 5px; font-size: 80%;">'
                + (n > 0 ? n.toLocaleString('en-US') : dash) + '</td>';
            const cells = {
                recentCommits: () => plain(recent),
                recentCommits90: () => plain(recent90),
                // commits (all time) — coloured by the file change-frequency band (heat palette).
                commits: () => colorCell(total, total > 0, bandColor(total, fileFreqThresholds, HEAT_PALETTE)),
                // line churn (lines added + deleted) per window; a muted dash when zero.
                churn30: () => plain(churn30),
                churn90: () => plain(churn90),
                churnTotal: () => plain(churnTotal),
                contributors: () => colorCell(contributors, contributors > 0, bandColor(contributors, fileContribThresholds, HEAT_PALETTE)),
                contributors30: () => plain(item.contributorsCount30Days || 0),
                contributors90: () => plain(item.contributorsCount90Days || 0),
                units: () => plain(item.unitsCount || 0),
                mcCabe: () => plain(item.mcCabeIndexSum || 0),
                age: () => colorCell(ageDays, ageDays >= 0, bandColor(ageDays, fileAgeThresholds, AGE_PALETTE)),
                freshness: () => colorCell(freshnessDays, freshnessDays >= 0, bandColor(freshnessDays, fileAgeThresholds, FRESHNESS_PALETTE)),
                latestCommit: () => '<td style="text-align: center; padding-right: 5px; padding-left: 5px; font-size: 80%; color: var(--sk-text-muted);">'
                    + (item.latestCommitDate ? esc(item.latestCommitDate) : dash) + '</td>',
                scope: () => {
                    let cell = '<td style="text-align: center; padding-right: 5px; padding-left: 5px;">';
                    if (scope === 'main') {
                        cell += '<div style="border: 1px solid var(--sk-border-strong); border-radius: 4px; padding: 0 4px; color: var(--sk-accent)">';
                    } else {
                        cell += '<div style="border: 1px solid var(--sk-border-strong); background-color: var(--sk-surface-3); border-radius: 4px; padding: 0 4px;">';
                    }
                    return cell + esc(scope) + '</div></td>';
                }
            };
            shown.forEach(c => html += cells[c.key]());
            html += '</tr>';
        });

        html += '</table>';

        document.getElementById('content').innerHTML = html;
    }

    // Defer the (synchronous, potentially heavy) first render one frame so the loading
    // spinner actually paints before the main thread is blocked, then swap it for the report.
    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            renderColumnsPanel(anyHistory);
            update();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('report').style.display = 'block';
        });
    });
</script>
</body>
</html>
